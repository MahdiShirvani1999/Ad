<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Vazirmatn",Tahoma,sans-serif;background:#1b130c;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#2a1a0c}
  .wrap{width:100%;max-width:1122px}
  .stage{position:relative;width:100%;container-type:inline-size}
  .pg{display:none}
  .pg.on{display:block}
  .art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .abs{position:absolute}
  .cov{position:absolute;display:block}
  .cov[data-cov="txt"],.cov[data-cov^="l"]{display:none}
  .live .cov[data-cov="txt"],.live .cov[data-cov^="l"]{display:block}
    .spr{position:absolute;object-fit:contain;display:block;transition:left .7s ease,top .7s ease,width .7s ease,height .7s ease;z-index:2}
  .live .spr{display:block}
  .txt{position:absolute;display:none;z-index:2;transition:opacity .35s ease;overflow:visible}
  .live .txt{display:block}
  .thumbHit{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:12px;z-index:4}
  .thumbHit:focus-visible{outline:2px solid #a0601f}

  .navL{left:2.5cqw}.navR{right:2.5cqw}
  .covertap{position:absolute;background:transparent;border:0;cursor:pointer}
  .dots{display:flex;gap:14px;justify-content:center;margin-top:14px;direction:ltr}
  .dot{background:none;border:0;cursor:pointer;color:#c9b59a;font:inherit;font-size:16px;font-weight:600;padding:4px 6px}
  .dot.on{color:#f2c48d;text-decoration:underline}
  .tbox{position:absolute;inset:0;direction:rtl;text-align:right;color:#2a1a0c}
  .tbox .tt{position:absolute;top:1.4cqw;right:1.3cqw;left:0;height:3.8cqw;font-size:2.4cqw;font-weight:700;color:#6b3a10;line-height:3.8cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbox .td{position:absolute;top:5.4cqw;right:1.3cqw;left:0;height:4.8cqw;font-size:1.45cqw;font-weight:400;color:#8a7460;line-height:2.4cqw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tbox .tsw{position:absolute;top:10.8cqw;right:1.3cqw;left:0;height:4.2cqw;display:flex;gap:1.6cqw;align-items:center;justify-content:flex-start}
  .tbox .tsw i{display:block;width:4.2cqw;height:4.2cqw;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .tbox .tsw i.sel{outline:2px solid #6b3a10;outline-offset:2px}
  .tbox .tpr{position:absolute;top:16cqw;right:9.5cqw;left:0;height:3.8cqw;font-size:2.4cqw;font-weight:700;color:#6b3a10;line-height:3.8cqw;white-space:nowrap}
  .tbox .tpr small{font-size:1.3cqw;font-weight:400;color:#8a7460;margin-left:.6cqw}
  .lbl{font-size:1.5cqw;line-height:1.5;color:#2a1a0c;direction:rtl;text-align:right}
  .lbl b{display:block;font-weight:600}
  .ptitle{position:absolute;background:#fff;color:#6b3a10;font-weight:600;font-size:2.1cqw;line-height:1;text-align:right;direction:rtl;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap;z-index:1;padding-right:0}
  .lbl{display:flex;flex-direction:column;gap:.3cqw;font-size:1.3cqw;font-weight:700;width:100%}
  .lbl b{font-size:1.3cqw;font-weight:700;line-height:1.5;white-space:nowrap}
  .lbl .row2{display:flex;align-items:center;justify-content:space-between;gap:.6cqw}
  .lbl span{font-size:1.3cqw;font-weight:700}
  .lbl span{color:#6b3a10;font-weight:700}
  .lbl .ld{display:flex;gap:.35cqw;direction:ltr;justify-content:flex-start}
  .lbl .ld i{display:block;width:1.5cqw;height:1.5cqw;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

</div>

<script>
const W=1122,H=1402;
const CREAM="#fcf3e7";
const PROD={"p1": {"name": "صندلی انتظار چرم اصل", "desc": "طراحی حرفه‌ای، ظاهری متمایز و راحتی متناسب با فضای مدیریت.", "price": "۱۳,۳۰۰,۰۰۰", "dots": [["#111", "black"], ["#b8691f", "sel"], ["#6b3a10", ""], ["#9b9b9b", ""]]}, "p2": {"name": "صندلی منشی چوبی", "desc": "ترکیبی از راحتی، دوام و طراحی برای فضاهای حرفه‌ای.", "price": "۱۱,۵۰۰,۰۰۰", "dots": [["#111", ""], ["#8a6f5a", ""], ["#9b9b9b", ""], ["#a8844f", "sel"]]}, "n54": {"name": "مبل اداری تک نفره - N54", "desc": "مبل تک نفره با پایهٔ فلزی طلایی و نشیمن پارچه‌ای سبک و مدرن.", "price": "۱۹,۰۰۰,۰۰۰", "dots": [["#111", ""], ["#6e5a4e", ""], ["#a9a9a9", ""], ["#b08a52", ""]]}, "v763": {"name": "مبل اداری تک نفره - V763", "desc": "مبل تک نفره با روکش مخملی سبز و پایه‌های چوبی، مناسب فضاهای مدیریت و انتظار.", "price": "۲۱,۶۰۰,۰۰۰", "dots": [["#111", ""], ["#9a9a9a", ""], ["#6b3a10", ""], ["#0e6b5c", ""]]}, "v753": {"name": "مبل اداری تک نفره - V753", "desc": "مبل تک نفره با روکش دکمه‌دار و ظاهری کلاسیک و گرم.", "price": "۲۱,۶۰۰,۰۰۰", "dots": [["#111", ""], ["#c0722a", ""], ["#9a2a2a", ""], ["#1f57d6", ""]]}, "n902": {"name": "صندلی اداری تک نفره - N902", "desc": "صندلی حصیری با بدنهٔ سبک و کوسن نشیمن، مناسب فضاهای آرام و مهمان‌پذیر.", "price": "۱۰,۰۰۰,۰۰۰", "dots": [["#111", ""], ["#b08a52", "sel"], ["#6b3a10", ""], ["#a9a9a9", ""]]}, "e217": {"name": "صندلی اداری تک نفره - E217", "desc": "صندلی راحتی با بدنهٔ چوبی و روکش چرمی نرم و تکیه‌گاه بلند.", "price": "۱۱,۹۰۰,۰۰۰", "dots": [["#111", ""], ["#9b9b9b", ""], ["#6b3a10", ""], ["#e8d6b4", "sel"]]}, "e67": {"name": "صندلی اداری تک نفره - E67", "desc": "صندلی سبک با پایهٔ کروم و نشیمن سفید، مناسب فضاهای کار و جلسات.", "price": "۶,۰۰۰,۰۰۰", "dots": [["#111", ""], ["#c0722a", ""], ["#ffffff", "sel"], ["#b08a52", ""]]}};
const CAT={"p1": {"hero": "p1", "thumbs": ["n54", "v763", "v753"]}, "p2": {"hero": "p2", "thumbs": ["n902", "e217", "e67"]}};
const SPR={};
// rectangles in artwork pixels: [x0,y0,x1,y1]
const LAYOUT={
  p1:{coverHero:[95,250,650,925],coverThumbs:[[100,900,345,1180],[425,900,670,1180],[750,900,1000,1180]],hero:[100,255,640,915],thumbs:[[110,950,330,1165],[435,955,655,1165],[760,955,985,1165]],
      labels:[[118,1186,338,1270],[448,1186,668,1270],[778,1186,998,1270]],text:[665,425,1055,775],panel:[335,797]},
  p2:{coverHero:[80,190,600,910],coverThumbs:[[100,900,345,1180],[425,900,670,1180],[760,900,1000,1180]],hero:[90,200,590,900],thumbs:[[110,920,325,1160],[440,915,655,1160],[775,915,985,1160]],
      labels:[[113,1186,333,1270],[438,1186,658,1270],[768,1186,988,1270]],text:[665,425,1055,775],panel:[320,790]}
};
const pct=(r)=>({left:(r[0]/W*100)+"%",top:(r[1]/H*100)+"%",width:((r[2]-r[0])/W*100)+"%",height:((r[3]-r[1])/H*100)+"%"});
function applyBox(el,r){const b=pct(r);Object.assign(el.style,b);}

// ---------- navigation ----------
const pages=[...document.querySelectorAll(".pg")];
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(pages.length-1,i));
  pages.forEach((p,k)=>p.classList.toggle("on",k===cur));
  document.querySelectorAll(".dot").forEach((d,k)=>d.classList.toggle("on",k===cur));
}
document.getElementById("coverNext").onclick=()=>go(1);
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(cur+(b.dataset.nav==="next"?1:-1)));
document.querySelectorAll(".dot").forEach(d=>d.onclick=()=>go(+d.dataset.go));
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight")go(cur+1); if(e.key==="ArrowLeft")go(cur-1); });
let sx=null; const st=document.getElementById("stage");
st.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
st.addEventListener("touchend",e=>{ if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?cur+1:cur-1); sx=null; });

// ---------- product animation ----------
const state={}; // page key -> {slots:[hero,t1,t2,t3]}
function initPage(sec){
  const key=sec.dataset.key; if(!key) return;
  const L=LAYOUT[key], c=CAT[key];
  state[key]={slots:[c.hero,...c.thumbs], live:false};
  // covers: hide the original artwork under the animated parts
  const [pt,pb]=L.panel;
  const hr=L.coverHero;
  const A=(pt-hr[1])/(hr[3]-hr[1])*100, B=(pb-hr[1])/(hr[3]-hr[1])*100;
  const hc=sec.querySelector('[data-cov="hero"]');
  applyBox(hc,hr);
  hc.style.background=`linear-gradient(#fff 0%,#fff ${Math.max(0,A)}%,${CREAM} ${Math.max(0,A)}%,${CREAM} ${Math.min(100,B)}%,#fff ${Math.min(100,B)}%)`;
  L.coverThumbs.forEach((t,i)=>{ const cv=sec.querySelector(`[data-cov="t${i}"]`); applyBox(cv,t); cv.style.background="#fff"; });
  L.labels.forEach((t,i)=>{ const cv=sec.querySelector(`[data-cov="l${i}"]`); applyBox(cv,t); cv.style.background="#fff"; });
  const tc=sec.querySelector('[data-cov="txt"]'); applyBox(tc,L.text); tc.style.background=CREAM;
  // chair sprites
  sec.querySelectorAll(".spr").forEach(el=>{
    const name=el.dataset.spr;
    el.dataset.key=name;
  });
  // hits over thumbnails
  sec.querySelectorAll("[data-hit]").forEach(b=>{
    const i=+b.dataset.hit; b.onclick=()=>swap(sec,key,i);
    applyBox(b,L.thumbs[i-1]);
  });
  sec.classList.add("live"); state[key].live=true;
  place(sec,key,false);
}
function slotKey(s){ return s; }
function place(sec,key,anim){
  const L=LAYOUT[key], S=state[key].slots;
  // chairs
  S.forEach((pk,s)=>{
    const el=sec.querySelector(`[data-spr="${pk===CAT[key].hero?"hero":pk}"]`);
    if(!el) return; // product not in art (should not happen)
    const r = s===0 ? L.hero : L.thumbs[s-1];
    applyBox(el,r);
  });
  // texts
  const shown=new Set();
  S.forEach((pk,s)=>{
    const tEl=sec.querySelector(`[data-txt="${s===0?"hero":"l"+(s-1)}"]`);
    const r = s===0 ? L.text : L.labels[s-1];
    applyBox(tEl,r);
    tEl.style.opacity=0;
    const html = s===0 ? heroHTML(pk) : labelHTML(pk);
    setTimeout(()=>{ tEl.innerHTML=html; tEl.style.opacity=1; }, anim?350:0);
  });
}
function heroHTML(pk){
  const p=PROD[pk];
  const dots=p.dots.map(([c,f])=>`<i class="${f==="sel"?"sel":""}" style="background:${c}"></i>`).join("");
  return `<div class="tbox">
    <div class="tt">${p.name}</div>
    <div class="td">${p.desc}</div>
    <div class="tsw">${dots}</div>
    <div class="tpr">${p.price}<small>تومان</small></div></div>`;
}
function labelHTML(pk){
  const p=PROD[pk];
  const dots=p.dots.map(([c,f])=>`<i class="${f==="sel"?"sel":""}" style="background:${c}"></i>`).join("");
  return `<div class="lbl"><b>${p.name}</b><div class="row2"><span>${p.price} تومان</span><div class="ld">${dots}</div></div></div>`;
}
function swap(sec,key,i){
  const st=state[key]; if(!st.live){ sec.classList.add("live"); st.live=true; }
  const S=st.slots; [S[0],S[i]]=[S[i],S[0]];
  place(sec,key,true);
}
document.querySelectorAll(".pg[data-key]").forEach(sec=>initPage(sec));
</script>
